# WASI 移植的最小配置：单进程前台模式（WASI 无 fork）
daemon off;
master_process off;
worker_processes 1;
error_log stderr notice;

events {
    worker_connections 256;
}

http {
    access_log off;
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        server_name localhost;

        location / {
            root html;
            index index.html;
        }

        # 反代到宿主上的 python http server（验证 proxy 模块）
        location /proxy/ {
            proxy_pass http://127.0.0.1:8081/;
        }
    }
}
